{% extends 'bookings/base.html' %}
{% block content %}

<style>
    .booking-section {
        min-height: 90vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 60px 20px;
        background: linear-gradient(rgba(0,0,0,0.85), rgba(0,0,0,0.85)),
                    url('https://images.unsplash.com/photo-1522335789203-aabd1fc54bc9?w=1600') center/cover fixed;
    }

    .booking-card {
        background: #141414;
        border: 1px solid rgba(201, 169, 110, 0.3);
        padding: 50px 45px;
        width: 100%;
        max-width: 650px;
        border-radius: 4px;
        box-shadow: 0 15px 35px rgba(0,0,0,0.6);
    }

    .booking-card .section-label {
        font-size: 11px;
        letter-spacing: 4px;
        text-transform: uppercase;
        color: #c9a96e;
        margin-bottom: 8px;
    }

    .booking-card h2 {
        font-family: 'Playfair Display', serif;
        font-size: 36px;
        color: #fff;
        margin-bottom: 8px;
    }

    .booking-card .service-tag {
        color: #c9a96e;
        font-size: 14px;
        margin-bottom: 30px;
        display: inline-block;
        background: rgba(201, 169, 110, 0.1);
        padding: 6px 14px;
        border-radius: 20px;
        border: 1px solid rgba(201, 169, 110, 0.25);
    }

    .form-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 18px;
    }

    .form-group {
        margin-bottom: 20px;
    }

    .form-group label {
        display: block;
        font-size: 11px;
        letter-spacing: 2px;
        text-transform: uppercase;
        color: #aaa;
        margin-bottom: 7px;
    }

    .form-group input, .form-group textarea {
        width: 100%;
        background: #0a0a0a;
        border: 1px solid #2a2a2a;
        color: #f0e6d3;
        padding: 13px 16px;
        font-size: 14px;
        font-family: 'Lato', sans-serif;
        transition: all 0.3s;
        outline: none;
        color-scheme: dark;
        border-radius: 2px;
    }

    .form-group input[type="date"]::-webkit-calendar-picker-indicator {
        background-color: #c9a96e;
        border-radius: 3px;
        padding: 4px;
        cursor: pointer;
    }

    .form-group input:focus, .form-group textarea:focus {
        border-color: #c9a96e;
        box-shadow: 0 0 10px rgba(201, 169, 110, 0.2);
    }

    .form-group textarea {
        height: 85px;
        resize: vertical;
    }

    /* TIME SLOTS INTERACTIVE GRID */
    .slots-container {
        margin-top: 10px;
    }

    .slots-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
        gap: 10px;
        margin-top: 10px;
    }

    .time-slot-btn {
        padding: 10px 8px;
        background: #0a0a0a;
        border: 1px solid #333;
        color: #f0e6d3;
        font-size: 12px;
        border-radius: 3px;
        cursor: pointer;
        transition: all 0.2s;
        text-align: center;
        font-family: 'Lato', sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
    }

    .time-slot-btn:hover:not(:disabled) {
        border-color: #c9a96e;
        background: rgba(201, 169, 110, 0.15);
        color: #fff;
    }

    .time-slot-btn.selected {
        background: #c9a96e;
        color: #000;
        font-weight: 700;
        border-color: #c9a96e;
        box-shadow: 0 0 12px rgba(201, 169, 110, 0.5);
    }

    .time-slot-btn:disabled {
        background: #181212;
        border-color: #331f1f;
        color: #664444;
        cursor: not-allowed;
        opacity: 0.7;
    }

    .slot-status-text {
        font-size: 9px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
    }

    .time-slot-btn.selected .slot-status-text {
        color: #000;
    }

    .time-slot-btn:disabled .slot-status-text {
        color: #ff6b6b;
    }

    .slots-helper {
        font-size: 11px;
        color: #888;
        margin-top: 6px;
    }

    .btn-submit {
        width: 100%;
        padding: 16px;
        background: #c9a96e;
        color: #000;
        border: none;
        font-size: 12px;
        letter-spacing: 3px;
        text-transform: uppercase;
        font-weight: 700;
        cursor: pointer;
        transition: all 0.3s;
        font-family: 'Lato', sans-serif;
        margin-top: 15px;
        border-radius: 2px;
    }

    .btn-submit:hover {
        background: #b8935a;
        transform: translateY(-1px);
    }

    @media (max-width: 600px) {
        .form-row { grid-template-columns: 1fr; }
        .booking-card { padding: 30px 20px; }
        .slots-grid { grid-template-columns: repeat(2, 1fr); }
    }
</style>

<section class="booking-section">
    <div class="booking-card">
        <p class="section-label">✦ Reserve Your Spot</p>
        <h2>Book Appointment</h2>
        <span class="service-tag">✨ {{ service.name }} — ₦{{ service.price|floatformat:0 }} ({{ service.duration_minutes }} mins)</span>

        <form method="POST" id="bookingForm">
            {% csrf_token %}
            <div class="form-row">
                <div class="form-group">
                    <label>First Name</label>
                    <input type="text" name="first_name" required value="{% if form_data.first_name %}{{ form_data.first_name }}{% elif user.is_authenticated %}{{ user.first_name|default:'' }}{% elif initial_client %}{{ initial_client.first_name }}{% endif %}" placeholder="First Name">
                </div>
                <div class="form-group">
                    <label>Last Name</label>
                    <input type="text" name="last_name" required value="{% if form_data.last_name %}{{ form_data.last_name }}{% elif user.is_authenticated %}{{ user.last_name|default:'' }}{% elif initial_client %}{{ initial_client.last_name }}{% endif %}" placeholder="Last Name">
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" name="email" required value="{% if form_data.email %}{{ form_data.email }}{% elif user.is_authenticated %}{{ user.email|default:'' }}{% elif initial_client %}{{ initial_client.email }}{% endif %}" placeholder="you@email.com">
                </div>
                <div class="form-group">
                    <label>Phone Number</label>
                    <input type="tel" name="phone" required value="{% if form_data.phone %}{{ form_data.phone }}{% elif initial_client %}{{ initial_client.phone }}{% endif %}" placeholder="+234 800 000 0000">
                </div>
            </div>

            <div class="form-group">
                <label>Select Date</label>
                <input type="date" name="date" id="dateInput" min="{{ today_date }}" required value="{{ form_data.date|default:today_date }}">
            </div>

            <div class="form-group">
                <label>Select Time Slot</label>
                <!-- Hidden input to store chosen slot -->
                <input type="hidden" name="time" id="timeInput" required value="{{ form_data.time|default:'' }}">
                
                <div class="slots-container">
                    <div class="slots-grid" id="slotsGrid">
                        <!-- Loaded dynamically via JS -->
                        <div style="grid-column: 1/-1; text-align: center; color: #888; padding: 15px; font-size: 13px;">
                            <i class="fas fa-spinner fa-spin"></i> Checking available slots...
                        </div>
                    </div>
                    <p class="slots-helper" id="slotHelperText">Select an available time slot above.</p>
                </div>
            </div>

            <div class="form-group">
                <label>Special Notes (Optional)</label>
                <textarea name="notes" placeholder="Any special requests, skin concerns, or inspiration...">{{ form_data.notes|default:'' }}</textarea>
            </div>

            <button type="submit" class="btn-submit" id="submitBtn">Confirm Booking</button>
        </form>
    </div>
</section>

<script>
    const dateInput = document.getElementById('dateInput');
    const timeInput = document.getElementById('timeInput');
    const slotsGrid = document.getElementById('slotsGrid');
    const slotHelperText = document.getElementById('slotHelperText');
    const bookingForm = document.getElementById('bookingForm');

    function fetchAvailableSlots(dateVal) {
        if (!dateVal) return;

        slotsGrid.innerHTML = `
            <div style="grid-column: 1/-1; text-align: center; color: #c9a96e; padding: 15px; font-size: 13px;">
                <i class="fas fa-spinner fa-spin"></i> Loading live slot availability...
            </div>
        `;

        fetch(`/api/available-slots/?date=${encodeURIComponent(dateVal)}&service_id={{ service.id }}`)
            .then(res => res.json())
            .then(data => {
                if (data.error) {
                    slotsGrid.innerHTML = `<div style="grid-column:1/-1; color:#ff6b6b; padding:10px;">${data.error}</div>`;
                    return;
                }

                slotsGrid.innerHTML = '';
                const selectedTime = timeInput.value;

                if (!data.slots || data.slots.length === 0) {
                    slotsGrid.innerHTML = `<div style="grid-column:1/-1; color:#888; text-align:center; padding:15px;">No time slots available for this date.</div>`;
                    return;
                }

                let foundSelected = false;

                data.slots.forEach(slot => {
                    const btn = document.createElement('button');
                    btn.type = 'button';
                    btn.className = 'time-slot-btn';
                    
                    const isCurrentSelected = (selectedTime && (selectedTime === slot.time || selectedTime.startsWith(slot.time)));

                    if (!slot.available) {
                        btn.disabled = true;
                        btn.innerHTML = `
                            <span>${slot.label}</span>
                            <span class="slot-status-text">${slot.status || 'Booked'}</span>
                        `;
                    } else {
                        if (isCurrentSelected) {
                            btn.classList.add('selected');
                            foundSelected = true;
                        }
                        btn.innerHTML = `
                            <span>${slot.label}</span>
                            <span class="slot-status-text">${isCurrentSelected ? '✓ Selected' : 'Available'}</span>
                        `;

                        btn.addEventListener('click', () => {
                            document.querySelectorAll('.time-slot-btn').forEach(b => {
                                b.classList.remove('selected');
                                const statusSpan = b.querySelector('.slot-status-text');
                                if (statusSpan && !b.disabled) {
                                    statusSpan.textContent = 'Available';
                                }
                            });

                            btn.classList.add('selected');
                            const statusSpan = btn.querySelector('.slot-status-text');
                            if (statusSpan) statusSpan.textContent = '✓ Selected';

                            timeInput.value = slot.time;
                            slotHelperText.textContent = `Selected: ${slot.label}`;
                            slotHelperText.style.color = '#c9a96e';
                        });
                    }

                    slotsGrid.appendChild(btn);
                });

                if (!foundSelected && selectedTime) {
                    timeInput.value = '';
                    slotHelperText.textContent = 'Please choose an available time slot.';
                    slotHelperText.style.color = '#888';
                }
            })
            .catch(err => {
                console.error(err);
                slotsGrid.innerHTML = `<div style="grid-column:1/-1; color:#ff6b6b; padding:10px;">Failed to load slots. Please select a date again.</div>`;
            });
    }

    dateInput.addEventListener('change', (e) => {
        fetchAvailableSlots(e.target.value);
    });

    // Form submit validation
    bookingForm.addEventListener('submit', (e) => {
        if (!timeInput.value) {
            e.preventDefault();
            alert('Please select an available time slot before submitting.');
            slotHelperText.textContent = '⚠️ Please select an available time slot!';
            slotHelperText.style.color = '#ff6b6b';
        }
    });

    // Initial load
    if (dateInput.value) {
        fetchAvailableSlots(dateInput.value);
    }
</script>

{% endblock %}
